kafka:
  topics:
    topic: fraud_topic
  server:
    bootstrap_servers: localhost:9092
  producer:
    retries: 3
    max_buffer: 10

storage:
  clickhouse:
    host: "localhost"
    port: 8123
    native_port: 9002       # host-mapped native TCP port (docker: 9002->9000)
    username: "default"
    password: ""
    jdbc_driver: "com.clickhouse.jdbc.ClickHouseDriver"
    native_driver: "com.clickhouse.spark.ClickHouseCatalog"
    database: "predictions"
    table:
      main_table: fraud_prediction
      monitor_table: model_monitor

  delta_lake:
    minio_endpoint: "http://localhost:9000"
    minio_endpoint_sdk: "localhost:9000"
    minio_access_key: "minio"
    minio_secret_key: "minio123"
    core_bucket: "deltalake"

model:
  model_1:
    id: model_1
  model_2:
    id: model_2

web:
  scan_interval_seconds: 10
  host: "0.0.0.0"
  port: 8000
