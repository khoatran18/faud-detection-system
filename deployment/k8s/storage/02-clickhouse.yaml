apiVersion: v1
kind: Service
metadata:
  name: clickhouse-headless
  namespace: fraud-prediction-platform
spec:
  clusterIP: None
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000

---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-internal
  namespace: fraud-prediction-platform
spec:
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: tabix-external
  namespace: fraud-prediction-platform
spec:
  selector:
    app: tabix
  ports:
    - name: tabix
      port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tabix-deployment
  namespace: fraud-prediction-platform
  labels:
    app: tabix
spec:
  selector:
    matchLabels:
      app: tabix
  template:
    metadata:
      labels:
        app: tabix
    spec:
      containers:
        - name: tabix
          image: spoonest/clickhouse-tabix-web-client
          ports:
            - containerPort: 80

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: fraud-prediction-platform
  labels:
    app: clickhouse
spec:
  serviceName: clickhouse-headless
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:latest
          ports:
            - containerPort: 8123   # HTTP interface
            - containerPort: 9000   # Native TCP interface
          volumeMounts:
            - mountPath: /var/lib/clickhouse
              name: clickhouse-storage
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

  volumeClaimTemplates:
    - metadata:
        name: clickhouse-storage
      spec:
        storageClassName: my-storage-class
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi

