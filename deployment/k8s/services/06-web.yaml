apiVersion: v1
kind: Service
metadata:
  name: web-ui
  namespace: fpp
spec:
  selector:
    app: web-ui
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
      name: http
  type: NodePort

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: fpp
  labels:
    app: web-ui
spec:
  selector:
    matchLabels:
      app: web-ui
  template:
    metadata:
      labels:
        app: web-ui
    spec:
      containers:
        - name: web-ui
          image: khoa2k4/project2:web-ui
          imagePullPolicy: Always
          env:
            - name: APP_ENV
              value: prod
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
