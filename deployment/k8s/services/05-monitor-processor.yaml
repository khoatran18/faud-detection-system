apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-processor
  namespace: fpp
  labels:
    app: monitor-processor
spec:
  selector:
    matchLabels:
      app: monitor-processor
  template:
    metadata:
      labels:
        app: monitor-processor
    spec:
      containers:
        - name: monitor-processor
          image: khoa2k4/project2:stream_monitor
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "model_monitor.monitor_stream_processor"]
          env:
            - name: APP_ENV
              value: prod
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "3Gi"
              cpu: "2"